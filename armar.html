<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>Armar övningar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <header>
        <h1>Armövningar</h1>
        <p>Här hittar du övningar för hela armen (biceps & triceps)</p>
    </header>

    <main>
        <div class="card">
            <h2>Bicepscurl</h2>
            <p>Tränar framsidan av armen.</p>
        </div>

        <div class="card">
            <h2>Hammercurl</h2>
            <p>Tränar biceps och underarmar.</p>
        </div>

        <div class="card">
            <h2>Triceps pushdown</h2>
            <p>Fokus på baksidan av armen.</p>
        </div>

        <div class="card">
            <h2>Dips</h2>
            <p>Tränar triceps och bröst.</p>
        </div>
    </main>

    <a href="index.html">← Tillbaka</a>
</div>

</body>
</html>
